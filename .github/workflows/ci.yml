name: ci

on:
  push:
    branches: [main]
  pull_request:
  # 供 publish.yml 复用：发布前必须先跑完整检查。
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # tui-test 与 build:tui 都走 bun
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: pnpm test:tui
      - run: pnpm build:tui

  # 用真的 opencode 按 npm 安装形态加载插件：插件加载失败就让 CI 红，发布也被 needs 挡住。
  plugin-load:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 故意不锁版本：上游发新版就让 CI 红，提醒适配。
      - id: opencode
        run: echo "version=$(npm view @opencode/cli version)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: opencode-cache
        with:
          path: .ci/opencode
          key: opencode-${{ runner.os }}-${{ steps.opencode.outputs.version }}

      - if: steps.opencode-cache.outputs.cache-hit != 'true'
        run: npm install --prefix .ci/opencode "@opencode/cli@${{ steps.opencode.outputs.version }}"

      - run: echo "$PWD/.ci/opencode/node_modules/.bin" >> "$GITHUB_PATH"
      - run: opencode --version

      - run: pnpm install --frozen-lockfile
      # prepack 会跑 build:tui，产物口径与发布一致。
      - run: bun scripts/ci-plugin-load.mjs

  # 真实 opencode + 假 provider 的端到端压缩链路：单测不覆盖的触发/对账/多轮行为全在这里。
  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 故意不锁版本：上游发新版就让 CI 红，提醒适配。
      - id: opencode
        run: echo "version=$(npm view @opencode/cli version)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: opencode-cache
        with:
          path: .ci/opencode
          key: opencode-${{ runner.os }}-${{ steps.opencode.outputs.version }}

      - if: steps.opencode-cache.outputs.cache-hit != 'true'
        run: npm install --prefix .ci/opencode "@opencode/cli@${{ steps.opencode.outputs.version }}"

      - run: echo "$PWD/.ci/opencode/node_modules/.bin" >> "$GITHUB_PATH"
      - run: opencode --version

      - run: pnpm install --frozen-lockfile
      # prepack 产物与发布一致；e2e 的 plugins 指向仓库根目录，宿主直接吃源码。
      - run: bun scripts/e2e-tool-loop.mjs
      - run: bun scripts/e2e-compress.mjs
      - run: bun scripts/e2e-nudge.mjs
      # 外部文件变更与多层配置实时自动同步。
      - run: bun scripts/e2e-settings-sync.mjs
      # 打断压缩后的恢复链路：假 provider 挂住摘要请求，验证 interrupted 不会留死锁。
      - run: bun scripts/e2e-repro-interrupt.mjs
      # 真实 TUI（PTY）需要发布口径的 dist/tui.js。
      - run: bun scripts/build-tui.mjs
      # 真实 TUI（PTY）里的插件弹窗：验证 TUI 入口在 Linux 上也能加载并交互。
      - run: bun scripts/e2e-native-compaction.mjs
      # 真实 TUI 里完整走一遍「触发压缩 → 点开块 → 编辑 → ctrl+s 保存」。
      - run: bun scripts/e2e-block-edit.mjs
      # 更新菜单：本地假 registry + 假 opencode，验证确认/进度/失败三条界面路径。
      - run: bun scripts/build-tui.mjs && bun scripts/e2e-update.mjs
