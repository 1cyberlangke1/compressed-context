name: ci

on:
  push:
    branches: [main]
  pull_request:
  # 供 publish.yml 复用：发布前必须先跑完整检查。
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # tui-test 与 build:tui 都走 bun
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: pnpm test:tui
      - run: pnpm build:tui
