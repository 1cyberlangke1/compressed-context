name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # 复用 ci.yml：检查不过就不发布。
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted Publishing 用 OIDC 换取短期 token，不需要 NPM_TOKEN。
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # prepack 用 bun 跑 OpenTUI 的 Solid 变换，先把工具链和依赖装好。
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # tag 名与 package.json 版本必须一致，避免 v0.2.17 实际发出 0.2.16 这类错位。
      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match package.json version $version"
            exit 1
          fi
      # Trusted Publishing 需要 npm >= 11.5.1，Node 22 自带的是 10.x
      - run: npm install -g npm@latest
      - run: npm publish --provenance --access public
