name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # 复用 ci.yml：检查不过就不发布。
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  publish:
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted Publishing 用 OIDC 换取短期 token，不需要 NPM_TOKEN。
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # prepack 用 bun 跑 OpenTUI 的 Solid 变换，先把工具链和依赖装好。
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # tag 名与 package.json 版本必须一致，避免 v0.2.17 实际发出 0.2.16 这类错位。
      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match package.json version $version"
            exit 1
          fi
      # Trusted Publishing 需要 npm >= 11.5.1，Node 22 自带的是 10.x
      - run: npm install -g npm@latest
      - run: npm publish --provenance --access public

  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # dev 只存在本地；远端发版只允许推进默认分支和 tag。
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Bump version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          npm version "$BUMP" --no-git-tag-version --ignore-scripts
          bun run sync:version
          version="$(node -p 'require("./package.json").version')"
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::tag $tag already exists"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - run: pnpm check
      - name: Commit version and create tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json src/shared/version.ts
          git commit -m "构建: 发布 ${VERSION} 喵" \
            -m "GitHub Actions 自动同步版本、检查并发布喵" \
            -m "Co-authored-by: codex-release-workflow-meow <312478326+nana-meow@users.noreply.github.com>"
          git tag "$TAG"
      - name: Push release commit and tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git push --atomic origin "HEAD:${DEFAULT_BRANCH}" "$TAG"
      - run: npm install -g npm@latest
      - run: npm publish --provenance --access public
